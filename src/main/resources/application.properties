spring.application.name=coursach_back

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blood_donation}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-minutes=${JWT_EXP_MIN:60}
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Force UTF-8 encoding on responses (Tomcat 11 defaults to ISO-8859-1)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

logging.level.ifmo.se.coursach_back=INFO

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
