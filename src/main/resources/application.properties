spring.application.name=coursach_back

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blood_donation}
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studs?sslmode=require&tcpKeepAlive=true&loginTimeout=5&connectTimeout=5&socketTimeout=10}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}
spring.flyway.baseline-description=baseline existing schema

security.jwt.secret=${JWT_SECRET:${SECURITY_JWT_SECRET:}}
security.jwt.expiration-minutes=${JWT_EXP_MIN:60}
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Force UTF-8 encoding on responses (Tomcat 11 defaults to ISO-8859-1)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

logging.level.ifmo.se.coursach_back=INFO

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173, http://localhost:27843}
server.port=${SERVER_PORT:9696}
